<!doctype html>
<!--
  리치온 아카데미 · 무료 브리핑 다시보기
  ▸ {{결제링크URL}} {{오픈채팅URL}} {{블로그URL}} {{카페URL}} {{유튜브URL}} 를 실제 값으로 교체하세요.
  ▸ 브리핑 영상 목록은 하단 <script>의 briefingVideos 배열만 수정하면 됩니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무료 브리핑 다시보기 · 리치온 아카데미</title>
<meta name="description" content="리치온 아카데미 무료 브리핑 다시보기. 갭투자, 경매, 부동산 흐름, 서울 재개발, 인테리어, 지방 재개발, 투자 기초, 현금흐름 브리핑을 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fff;--paper:#f6f5f2;--paper-2:#efece4;
    --ink:#1c1f26;--ink-soft:#54585f;--faint:#8a8d93;
    --orange:#f47920;--orange-2:#ff913f;--gold:#c9a86a;--gold-2:#ddc28a;
    --line:#e6e3db;--line-strong:#d9d1bf;--dark:#1c1f26;
    --maxw:1180px;--serif:'Fraunces',serif;--sans:'Pretendard',system-ui,sans-serif;
    --shadow:0 22px 50px -30px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .announce{background:linear-gradient(90deg,var(--orange),#e0641a);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px 16px}
  .announce a{text-decoration:underline;text-underline-offset:2px}
  nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:color-mix(in srgb,#fff 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:baseline;gap:2px;font-weight:900;font-size:23px;letter-spacing:-.02em}
  .logo .o{color:var(--orange)}
  .logo small{font-size:10px;letter-spacing:.25em;color:var(--gold);font-weight:700;margin-left:8px}
  .nav-links{display:flex;align-items:center;gap:22px;font-size:14px;color:var(--ink-soft);font-weight:700}
  .nav-links a:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;white-space:nowrap;transition:.2s}
  .btn-o{background:var(--orange);color:#fff}
  .btn-o:hover{background:var(--orange-2);transform:translateY(-2px)}
  .btn-line{border:1px solid var(--line-strong);color:var(--ink)}
  .btn-line:hover{border-color:var(--gold);color:#9a6d18}
  @media(max-width:760px){.nav-links a:not(.btn){display:none}.logo small{display:none}.wrap{padding:0 18px}}

  .hero{position:relative;overflow:hidden;text-align:center;padding:74px 0 34px;background-image:linear-gradient(rgba(201,168,106,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,106,.14) 1px,transparent 1px);background-size:54px 54px}
  .eyebrow{font-family:var(--serif);font-style:italic;color:#a9842f;font-size:15px;margin-bottom:12px}
  h1{font-size:clamp(34px,5.8vw,60px);line-height:1.06;letter-spacing:-.035em;font-weight:900}
  h1 b{color:var(--orange)}
  .hero p{max-width:760px;margin:16px auto 0;color:var(--ink-soft);font-size:clamp(15px,1.5vw,18px)}
  .hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}

  .filter-band{border-top:2px solid var(--orange);background:#fbfaf7;padding:20px 0;border-bottom:1px solid var(--line)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:8px 17px;font-size:14px;font-weight:900;cursor:pointer;transition:.18s}
  .chip:hover{border-color:var(--orange);color:var(--orange)}
  .chip.on{background:var(--orange);border-color:var(--orange);color:#fff}

  .section{padding:46px 0 82px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}
  .section-head h2{font-size:clamp(24px,3.2vw,36px);line-height:1.12;letter-spacing:-.025em}
  .section-head p{max-width:520px;color:var(--ink-soft);font-size:14.5px}
  @media(max-width:760px){.section-head{display:block}.section-head p{margin-top:10px}}

  .video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  @media(max-width:1040px){.video-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:780px){.video-grid{grid-template-columns:repeat(2,1fr);gap:14px}}
  @media(max-width:540px){.video-grid{grid-template-columns:1fr}}
  .lesson-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
  .thumb{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#f3f1ea;background-image:linear-gradient(rgba(150,120,60,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(150,120,60,.12) 1px,transparent 1px);background-size:34px 34px}
  .thumb.dark{background:linear-gradient(135deg,#1f2630,#101217)}
  .thumb.orange{background:linear-gradient(135deg,#f7e7d6,#f4f1ea)}
  .thumb.pink{background:linear-gradient(135deg,#ffe3d8,#f6f1e9)}
  .thumb-title{position:relative;z-index:2;font-size:clamp(18px,2.1vw,25px);line-height:1.16;font-weight:900;letter-spacing:-.025em;color:#9a7b32;padding:18px}
  .thumb.dark .thumb-title{color:#fff}
  .play{position:absolute;z-index:3;left:50%;top:50%;width:58px;height:58px;border:3px solid rgba(255,255,255,.92);border-radius:50%;transform:translate(-50%,-50%);background:rgba(28,31,38,.18);box-shadow:0 12px 30px -16px rgba(0,0,0,.65)}
  .play::after{content:"";position:absolute;left:22px;top:16px;border-left:17px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
  .badge{position:absolute;left:10px;top:10px;z-index:4;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}
  .badge.free{background:var(--orange);color:#fff}
  .badge.paid{background:var(--dark);color:#fff}
  .lesson-body{padding:15px;display:flex;flex-direction:column;gap:10px;flex:1}
  .lesson-body h3{font-size:17px;line-height:1.32;letter-spacing:-.01em}
  .lesson-desc{color:var(--ink-soft);font-size:13.5px;line-height:1.55;flex:1}
  .lesson-meta{display:flex;justify-content:space-between;gap:10px;color:var(--faint);font-size:12px;font-weight:700}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tags span{border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:11px;color:var(--ink-soft)}
  .empty{display:none;text-align:center;padding:46px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--ink-soft);background:#fff}

  .cta{padding:72px 0;text-align:center;background:linear-gradient(180deg,#fff,#f6f5f2)}
  .cta h2{font-size:clamp(28px,4.4vw,46px);line-height:1.12;letter-spacing:-.03em}
  .cta p{margin:14px auto 26px;max-width:680px;color:var(--ink-soft)}
  .cta-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  footer{background:#f2f1ec;border-top:1px solid var(--line);padding:34px 0;color:var(--faint);font-size:13px}
  footer .foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
  footer .links{display:flex;gap:16px}
  footer a:hover{color:#9a6d18}
</style>
</head>
<body>
<nav>
  <a class="logo" href="richon-homepage.html"><span>RICH</span><span class="o">ON</span><small>ESTATE STUDY</small></a>
  <div class="nav-links">
    <a href="richon-apply-ver5.html" class="btn btn-o">강의 신청</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">RICHON BRIEFING ARCHIVE</p>
    <h1>무료 브리핑 <b>다시보기</b></h1>
    <p>놓친 무료 브리핑을 주제별로 다시 확인하세요. </p>
  </div>
</header>

<section class="filter-band" aria-label="강의 필터">
  <div class="wrap">
    <div class="chips" id="filterChips"></div>
  </div>
</section>

<main class="section" id="lessons">
  <div class="wrap">
    <div class="video-grid" id="lessonGrid"></div>
    <div class="empty" id="emptyState">선택한 태그에 해당하는 강의가 없습니다.</div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="logo" href="richon-homepage.html"><span>RICH</span><span class="o">ON</span></a>
    <div class="links">
      <a href="{{블로그URL}}" target="_blank" rel="noopener">블로그</a>
      <a href="{{카페URL}}" target="_blank" rel="noopener">카페</a>
      <a href="{{유튜브URL}}" target="_blank" rel="noopener">유튜브</a>
    </div>
  </div>
</footer>

<script>
  const briefingVideos=[
    {id:'briefing-gap',title:'갭투자',tags:['갭투자'],tone:'orange',description:'전세가율, 입주 물량, 보유 현금흐름을 함께 점검하며 갭투자 판단 기준을 정리합니다.'},
    {id:'briefing-auction',title:'경매',tags:['경매'],tone:'dark',description:'낙찰가율과 입찰 흐름으로 가격 안전마진과 시장 온도를 확인합니다.'},
    {id:'briefing-market',title:'부동산 흐름',tags:['부동산 흐름'],tone:'paper',description:'정책, 금리, 거래량, 지역 수요를 함께 보며 지금 시장의 방향을 읽습니다.'},
    {id:'briefing-seoul-redev',title:'서울 재개발',tags:['서울 재개발'],tone:'paper',description:'서울 초기 재개발 후보지를 볼 때 필요한 입지, 사업 단계, 공급 변수를 짚습니다.'},
    {id:'briefing-interior',title:'인테리어',tags:['인테리어'],tone:'orange',description:'공간 개선이 임대 경쟁력과 매도 매력도에 어떻게 연결되는지 확인합니다.'},
    {id:'briefing-local-redev',title:'지방 재개발',tags:['지방 재개발'],tone:'dark',description:'지방 재개발에서 수요, 공급, 규제, 가격 메리트를 구분해 보는 관점을 정리합니다.'},
    {id:'briefing-basic',title:'투자 기초',tags:['투자 기초'],tone:'paper',description:'처음 투자 판단을 시작할 때 필요한 자금 계획, 리스크, 시장 읽기 기준을 다룹니다.'},
    {id:'briefing-cashflow',title:'현금흐름',tags:['현금흐름'],tone:'orange',description:'보유 기간의 비용과 수입을 점검해 무리 없는 투자 판단을 세우는 브리핑입니다.'}
  ];
  const tags=['전체','갭투자','경매','부동산 흐름','서울 재개발','인테리어','지방 재개발','투자 기초','현금흐름'];
  let active='전체';
  const chipRoot=document.getElementById('filterChips');
  const grid=document.getElementById('lessonGrid');
  const empty=document.getElementById('emptyState');
  function renderChips(){
    chipRoot.innerHTML='';
    tags.forEach(tag=>{
      const btn=document.createElement('button');
      btn.className='chip'+(tag===active?' on':'');
      btn.type='button';
      btn.textContent='#'+tag;
      btn.addEventListener('click',()=>{active=tag;renderChips();renderLessons();});
      chipRoot.appendChild(btn);
    });
  }
  function renderLessons(){
    const filtered=active==='전체'?briefingVideos:briefingVideos.filter(lesson=>lesson.tags.includes(active));
    grid.innerHTML='';
    empty.style.display=filtered.length?'none':'block';
    filtered.forEach(lesson=>{
      const card=document.createElement('article');
      card.className='lesson-card';
      const tone=lesson.tone==='dark'?' dark':lesson.tone==='orange'?' orange':lesson.tone==='pink'?' pink':'';
      card.innerHTML=`
        <div class="thumb${tone}">
          <span class="badge free">무료 브리핑</span>
          <div class="thumb-title">${lesson.title.replace(/ /g,'<br>')}</div>
          <span class="play" aria-hidden="true"></span>
        </div>
        <div class="lesson-body">
          <div class="lesson-meta"><span>RICHON BRIEFING</span><span>무료</span></div>
          <h3>${lesson.title}</h3>
          <p class="lesson-desc">${lesson.description}</p>
          <div class="tags">${lesson.tags.map(tag=>`<span>${tag}</span>`).join('')}</div>
        </div>`;
      grid.appendChild(card);
    });
  }
  renderChips();
  renderLessons();
</script>
</body>
</html>
